version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: sih26002_postgis
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: sih26002_gis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sih26002_gis"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: sih26002_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/sih26002_gis
      OSRM_BASE_URL: https://router.project-osrm.org
      OPEN_METEO_BASE_URL: https://api.open-meteo.com/v1
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
